<div class="container-fluid">
  <div class="row">
    
    <!-- Sidebar -->
    <div *ngIf="CatWithTasks.length > 0" class="col-md-2 sidebar bg-light">
      <button class="btn btn-primary w-100 my-2" (click)="openPopupAddTask()">Create Task</button>
      <ul class="list-group">
        <li class="list-group-item active">All Tasks</li>
        <li class="list-group-item" *ngFor="let cat of CatWithTasks">{{ cat.name }}</li>
      </ul>
    </div>

    <!-- Main Content -->
    <div *ngIf="CatWithTasks.length > 0" class="col-md-10 main-content">
      <div class="row">
        <!-- College Tasks -->
        <div class="col-md-3 card mx-5" *ngFor="let category of CatWithTasks">
          <div class="card-header">
            <h5>{{ category.name }}</h5>
            <a href="#" class="text-primary">Add a task</a>
          </div>
          <ul class="list-group list-group-flush">
            <li class="list-group-item" *ngFor="let task of category.tasks">
              <div>
                <h5>{{ task.title }}</h5>
                <p class="mx-2 paraG">➤ {{ task.description }}</p>
              </div>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>

<!-- Modal for Adding Task -->
<div id="addTaskModal" class="modal fade" tabindex="-1" aria-labelledby="addTaskModalLabel" aria-hidden="true" style="display: none;">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h4 class="modal-title" id="addTaskModalLabel">Create New Task</h4>
        <button type="button" class="btn-close" (click)="closeModal()" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="row">
          <div class="col-12">
            <label for="taskName">Task Name</label>
            <input type="text" id="name" class="form-control" [(ngModel)]="newCategory.name" />
          </div>
        </div>
        <div class="row my-3">
          <div class="col-12">
            <label for="taskColor">Task Color</label>
            <input type="color" id="color" class="form-control" [(ngModel)]="newCategory.color" />
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-danger" (click)="closeModal()">Close</button>
        <button type="button" class="btn btn-success" (click)="submitTask()">Submit</button>
      </div>
    </div>
  </div>
</div>
